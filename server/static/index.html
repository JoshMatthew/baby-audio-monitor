<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Baby Monitor</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Baby Monitor</h1>
      <p id="status" role="status" data-state="stopped">Not listening</p>
      <div class="meter" aria-hidden="true"><div id="level"></div></div>

      <form id="login">
        <input
          type="text"
          name="username"
          autocomplete="username"
          value="baby-monitor"
          hidden
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          enterkeyhint="go"
          required
        />
        <button type="submit">Start listening</button>
      </form>

      <div id="controls" hidden>
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="5" step="0.1" value="1" />
        <button id="stop" type="button">Stop</button>
      </div>
    </main>
  </body>
</html>
